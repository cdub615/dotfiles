general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Power-aware idle: moderate on battery, relaxed on AC (never suspend while plugged in).
# /sys/class/power_supply/AC*/online == "0" -> on battery, "1" -> plugged in.
# omarchy-system-lock turns off the display + keyboard backlight ~3s after locking,
# so a dedicated dpms/backlight timer is no longer needed.

# ===== BATTERY set (moderate) =====

# Screensaver — 5 min
listener {
    timeout = 300
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null)" = "0" ] && { pidof hyprlock || omarchy-launch-screensaver; }
}

# Lock — 10 min (also handles screen + keyboard backlight off)
listener {
    timeout = 600
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null)" = "0" ] && omarchy-system-lock
    on-resume  = omarchy-system-wake
}

# Auto-suspend — 30 min (battery only)
listener {
    timeout = 1800
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null)" = "0" ] && systemctl suspend
}

# ===== AC set (relaxed, never suspend) =====

# Screensaver — 15 min
listener {
    timeout = 900
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null)" = "1" ] && { pidof hyprlock || omarchy-launch-screensaver; }
}

# Lock — 30 min (also handles screen + keyboard backlight off)
listener {
    timeout = 1800
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null)" = "1" ] && omarchy-system-lock
    on-resume  = omarchy-system-wake
}
